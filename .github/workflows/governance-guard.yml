# Fails an implementer pull request that changes a locked governance path (AGENTS.md, Pull
# requests). The supervisor makes it a required check on main and merges past it when they asked
# for the change. It reads the file list from the API and never checks out pull request code.
name: Governance guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

env:
  IMPLEMENTER: mechakapral[bot]

jobs:
  # Runs for every pull request, so that as a required check it reports a result on the
  # supervisor's own pull requests too.
  locked-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check the changed files against the locked paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$AUTHOR" != "$IMPLEMENTER" ]; then
            echo "Opened by $AUTHOR, not the implementer: nothing to check."
            exit 0
          fi
          # Kept apart from the grep below, so that an API failure fails the job instead of
          # reading as "no files". A rename counts under its old path too.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          locked=$(printf '%s\n' "$files" \
            | grep -E '^(\.specify/memory/constitution\.md|AGENTS\.md|REVIEW\.md|docs/answering-reviews\.md)$|^\.claude/skills/' \
            | sort -u || true)
          if [ -n "$locked" ]; then
            echo "::error::This implementer pull request changes locked governance paths. Only the supervisor merges past this check, when they asked for the change."
            printf '%s\n' "$locked"
            exit 1
          fi
          echo "No locked path changed."
